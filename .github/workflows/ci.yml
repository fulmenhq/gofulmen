name: CI
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Test (container)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.4.1
      options: --user 1001
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      GOPATH: ${{ github.workspace }}/.cache/go
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Go version
        run: go version
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Verify runner toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "PATH=$PATH"
          echo "go: $(go version)"
          echo "goneat: $(goneat --version | head -n1)"
          echo "sfetch: $(sfetch --version | head -n1)"
          echo "actionlint: $(actionlint -version 2>/dev/null || true)"
          echo "golangci-lint: $(golangci-lint version | head -n1)"
          echo "make: $(make --version | head -n1)"
          echo "bash: $(bash --version | head -n1)"
      - name: Format (fail on diff)
        run: |
          set -euo pipefail
          make fmt
          git diff --exit-code
      - name: Run tests
        run: make test
      - name: Run lint
        run: make lint
      - name: Build
        run: go build ./...
  # Separate job to verify external installation works
  # NOTE: This test will fail until the repository is made public
  install-test:
    name: External Installation Test
    runs-on: ubuntu-latest
    # Exercise external install only after changes land on main; PRs test the branch directly above.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Test go get installation
        run: |
          # Create a temporary test project
          mkdir -p /tmp/test-install
          cd /tmp/test-install
          go mod init test-install

          # Try to get gofulmen (will use latest commit on main)
          go get github.com/fulmenhq/gofulmen@main

          # Verify it can be imported
          cat > main.go << 'GOEOF'
          package main
          import (
              "fmt"
              "github.com/fulmenhq/gofulmen/foundry"
          )
          func main() {
              catalog := foundry.GetDefaultCatalog()
              pattern, _ := catalog.GetPattern("ansi-email")
              fmt.Printf("Loaded pattern: %s\n", pattern.Name)
          }
          GOEOF

          # Try to build it
          go build .

          # Run it
          ./test-install

          echo "✅ External installation test passed"
