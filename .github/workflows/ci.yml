name: CI
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Test (container)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools:v0.1.5
      # TEMP: Run as root so we can install `minisign` until the goneat-tools image includes it.
      # TODO(fulmen-toolbox): remove this and return to `--user 1001` once `minisign` is baked into the image.
      options: --user 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install minisign (temporary)
        run: |
          set -euo pipefail
          if command -v minisign >/dev/null 2>&1; then
            minisign -v || true
            exit 0
          fi
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache minisign
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends minisign
          else
            echo "error: no supported package manager found to install minisign" >&2
            exit 1
          fi
          minisign -v || true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Verify Go version
        run: go version
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Install sfetch + goneat (verified)
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          curl -sSfL https://github.com/3leaps/sfetch/releases/latest/download/install-sfetch.sh | bash -s -- --yes --dir "$BIN_DIR"
          export PATH="$BIN_DIR:$PATH"
          sfetch --self-verify
          sfetch --repo fulmenhq/goneat \
            --tag v0.3.18 \
            --dest-dir "$BIN_DIR" \
            --require-minisign
          if [ -f "$BIN_DIR/goneat.exe" ] && [ ! -f "$BIN_DIR/goneat" ]; then
            mv "$BIN_DIR/goneat.exe" "$BIN_DIR/goneat"
          fi
          goneat --version
      - name: Format (fail on diff)
        run: |
          set -euo pipefail
          make fmt
          git diff --exit-code
      - name: Install golangci-lint (v2.4.0)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          args: --help
      - name: Run tests
        run: make test
      - name: Run lint
        run: make lint
      - name: Build
        run: go build ./...
  # Separate job to verify external installation works
  # NOTE: This test will fail until the repository is made public
  install-test:
    name: External Installation Test
    runs-on: ubuntu-latest
    # Skip this test for now - will work once repo is public
    if: false
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test go get installation
        run: |
          # Create a temporary test project
          mkdir -p /tmp/test-install
          cd /tmp/test-install
          go mod init test-install

          # Try to get gofulmen (will use latest commit on main)
          go get github.com/fulmenhq/gofulmen@main

          # Verify it can be imported
          cat > main.go << 'GOEOF'
          package main
          import (
              "fmt"
              "github.com/fulmenhq/gofulmen/foundry"
          )
          func main() {
              catalog := foundry.GetDefaultCatalog()
              pattern, _ := catalog.GetPattern("ansi-email")
              fmt.Printf("Loaded pattern: %s\n", pattern.Name)
          }
          GOEOF

          # Try to build it
          go build .

          # Run it
          ./test-install

          echo "✅ External installation test passed"
