name: CI
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Test (container)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.12@sha256:616a4b5361d2cf7d32ac32496d58e9c288660d5606f0a27efdbf56e3a462ab2d
      options: --user 1001
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      GOPATH: ${{ github.workspace }}/.cache/go
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify runner toolchain
        run: ./scripts/verify-runner-toolchain.sh
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Format (fail on diff)
        run: |
          set -euo pipefail
          make fmt
          git diff --exit-code
      - name: Run tests
        run: make test
      - name: Run lint
        run: make lint
      - name: Build
        run: go build ./...
  # Separate job to verify external installation works
  # NOTE: This test will fail until the repository is made public
  install-test:
    name: External Installation Test
    runs-on: ubuntu-latest
    # Exercise external install on PR heads and again after changes land on main.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: "1.26.9"
      - name: Resolve install ref
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "GOFULMEN_REF=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "GOFULMEN_REF=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi
      - name: Test go get installation
        run: |
          # Create a temporary test project
          mkdir -p /tmp/test-install
          cd /tmp/test-install
          go mod init test-install

          # Verify it can be imported
          cat > main.go << 'GOEOF'
          package main
          import (
              "fmt"
              "github.com/fulmenhq/gofulmen/foundry"
          )
          func main() {
              catalog := foundry.GetDefaultCatalog()
              pattern, _ := catalog.GetPattern("ansi-email")
              fmt.Printf("Loaded pattern: %s\n", pattern.Name)
          }
          GOEOF

          # Try to get the imported package from the exact PR or main commit.
          go get "github.com/fulmenhq/gofulmen/foundry@${GOFULMEN_REF}"

          # Try to build it
          go build .

          # Run it
          ./test-install

          echo "✅ External installation test passed"
